<!doctype html>
<html lang="fr-CA">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion — Espace membre</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="login-container">
        <section class="login-card" aria-labelledby="login-heading">
            <h1 id="login-heading">Connexion</h1>
            <p class="subtitle">
                Veuillez entrer vos identifiants pour accéder à votre compte.
            </p>

            <!-- novalidate laisse le JavaScript gérer les messages d'erreur accessibles -->
            <form id="loginForm" action="#" method="POST" novalidate>
                <!-- Champ Courriel -->
                <div class="form-group">
                    <label for="email">Adresse courriel <span aria-hidden="true">*</span></label>
                    <input type="email" id="email" name="email" required autocomplete="email" aria-required="true"
                        aria-invalid="false" aria-describedby="email-error" />
                    <!-- Zone d'annonce dynamique pour les lecteurs d'écran -->
                    <div id="email-error" class="error-message" aria-live="polite"></div>
                </div>

                <!-- Champ Mot de passe -->
                <div class="form-group">
                    <label for="password">Mot de passe <span aria-hidden="true">*</span></label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required minlength="6"
                            autocomplete="current-password" aria-required="true" aria-invalid="false"
                            aria-describedby="password-error" />
                        <button type="button" id="togglePassword" class="toggle-password"
                            aria-label="Afficher le mot de passe" aria-pressed="false">
                            Afficher
                        </button>
                    </div>
                    <div id="password-error" class="error-message" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn-submit">Se connecter</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
